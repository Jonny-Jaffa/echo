<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message</title>
    <link rel="stylesheet" href="./message-popup.css" />
  </head>
  <body>
    <article class="message-popup" id="message-popup">
      <div class="message-popup-button-grid" id="message-popup-button-grid"></div>
      <div class="message-popup-row">
        <div class="message-popup-source" id="message-popup-source">Rec</div>
        <p class="message-popup-text" id="message-popup-text"></p>
        <button class="message-popup-open-message" id="message-popup-open-message" type="button" aria-label="Open messages">Messages</button>
      </div>
      <button class="message-popup-close" id="message-popup-close" type="button" aria-label="Dismiss message">Close</button>
    </article>
    <script src="./message-popup.js"></script>
  </body>
</html>
