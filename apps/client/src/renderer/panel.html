<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="stylesheet" href="./panel.css" />
    <link rel="stylesheet" href="./shared-panel.css" />
    <title>Pip Surgery</title>
  </head>
  <body data-view="panel">

    <main class="panel-shell">
      <aside class="thread-rail message-thread-bar no-drag" id="message-thread-rail" aria-label="Message threads">
        <div class="message-thread-scroll-wrap">
          <button class="message-thread-scroll-button is-scroll-left" id="message-thread-scroll-left" type="button" aria-label="Scroll up" title="Scroll up" hidden>Scroll up</button>
          <div class="message-thread-list" id="message-thread-list"></div>
          <button class="message-thread-scroll-button is-scroll-right" id="message-thread-scroll-right" type="button" aria-label="Scroll down" title="Scroll down" hidden>Scroll down</button>
        </div>
      </aside>

      <section class="panel-card drag-region">
        <div class="status-row drag-region">
          <div class="brand-lockup">
            <img class="brand-logo" src="../assets/pip-logo-colour.png" alt="Pip" />
          </div>
          <div class="toolbar no-drag">
          
            <div class="status-block" id="status-indicator" title="Connecting" aria-label="Connecting">
              <span class="status-dot" id="status-dot" aria-hidden="true" style="display:none"></span>
            </div>
          
            <div class="panel-display-mode no-drag">
              <button
                class="panel-icon-button panel-quick-actions-button"
                id="quick-actions-toggle-button"
                type="button"
                aria-label="Display options"
                aria-expanded="false"
                title="Display options"
              >
                Display options
              </button>
              <div class="panel-display-mode-menu hidden" id="panel-display-mode-menu">
                <button class="panel-display-mode-option" data-panel-mode="messages" type="button">Messages</button>
                <button class="panel-display-mode-option" data-panel-mode="buttons" type="button">Buttons</button>
                <button class="panel-display-mode-option" data-panel-mode="both" type="button">Both</button>
              </div>
            </div>
          <button
              class="panel-icon-button panel-settings-button"
              id="server-toggle-button"
              type="button"
              aria-label="Show settings"
              aria-expanded="false"
              title="Settings"
            >
              Settings
            </button>
            <button
              class="panel-icon-button panel-expand-button"
              id="panel-expand-button"
              type="button"
              aria-label="Expand window"
              title="Expand window"
            >
              Expand window
            </button>
            <button
              class="panel-icon-button panel-minimize-button"
              id="panel-minimize-button"
              type="button"
              aria-label="Minimise window"
              title="Minimise window"
            >
              Minimise window
            </button>
            <button
              class="panel-icon-button panel-close-button"
              id="panel-close-button"
              type="button"
              aria-label="Close panel"
              title="Close panel"
            >
              Close
            </button>
          </div>
        </div>

        <div class="reception-ping-banner hidden" id="reception-ping-banner">Reception</div>
        <div class="reception-offline-banner hidden" id="reception-offline-banner">
          <span class="reception-offline-banner-icon" aria-hidden="true"></span>
          <span>Reception is offline</span>
        </div>

        <section class="quick-actions hidden" id="quick-actions">
          <div class="panel-actions quick-action-grid" id="quick-action-grid"></div>
        </section>
        <section class="message-shell room-message-shell">
          <div class="message-context-bar">
            <div class="message-context-copy">
              <button
                class="thread-rail-toggle"
                id="thread-rail-toggle-button"
                type="button"
                aria-label="Collapse message threads"
                aria-expanded="true"
                title="Collapse message threads"
              >
                Message threads
              </button>
              <span class="message-context-label" id="message-context-label">Reception</span>
            </div>
          </div>
          <div class="message-list" id="message-list"></div>
          <div class="message-compose">
            <div class="message-compose-row">
              <textarea
                class="message-compose-input"
                id="message-compose-input"
                rows="1"
                maxlength="500"
                placeholder="message"
              ></textarea>
              <button class="message-emoji-button" id="message-emoji-button" type="button" aria-label="Emoji picker" title="Emoji picker">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="20" height="20"><path d="M464 256a208 208 0 1 0 -416 0 208 208 0 1 0 416 0zM0 256a256 256 0 1 1 512 0 256 256 0 1 1 -512 0zm177.3 63.4C192.3 335 218.4 352 256 352s63.7-17 78.7-32.6c9.2-9.6 24.4-9.9 33.9-.7s9.9 24.4 .7 33.9c-22.1 23-60 47.4-113.3 47.4s-91.2-24.4-113.3-47.4c-9.2-9.6-8.9-24.8 .7-33.9s24.8-8.9 33.9 .7zM144 208a32 32 0 1 1 64 0 32 32 0 1 1 -64 0zm192-32a32 32 0 1 1 0 64 32 32 0 1 1 0-64z"/></svg>
              </button>
            </div>
            <button class="message-send-button" id="message-send-button" type="button" aria-label="Send message" title="Send message">Send</button>
          </div>
          <div class="emoji-picker hidden" id="emoji-picker"></div>
        </section>

        <div class="server-panel hidden push-down" id="server-panel">
          <div class="settings-layout">
            <aside class="settings-sidebar" aria-label="Settings sections">
              <button class="settings-sidebar-link is-active" type="button" data-settings-section-link="settings-general">General</button>
              <button class="settings-sidebar-link" type="button" data-settings-section-link="settings-buttons">Buttons</button>
              <button class="settings-sidebar-link" type="button" data-settings-section-link="settings-sounds">Sounds</button>
              <button class="settings-sidebar-link" type="button" data-settings-section-link="settings-connection">Connection</button>
            </aside>
            <div class="settings-content">
          <section class="settings-section settings-tab-section" id="settings-connection" data-settings-section="settings-connection" hidden>
            <div class="settings-section-head">
              <div>
                <h3>Connection</h3>
              </div>
            </div>
            <div class="server-connection-row">
              <label class="field server-field">
                <span>Reception Address</span>
                <input id="server-input" type="text" />
                <div class="hardware-status connection-hardware-status" id="hardware-status">Neo: Starting</div>
              </label>
              <label class="field server-field">
                <span>Pairing Code</span>
                <input id="server-access-key-input" type="text" autocomplete="off" spellcheck="false" />
              </label>
            </div>
          </section>

          <section class="settings-section settings-tab-section" id="settings-buttons" data-settings-section="settings-buttons" hidden>
            <div class="settings-section-head">
              <div>
                <h3>Buttons</h3>
              </div>
            </div>
            <div class="selected-room-volume" id="selected-room-volume"></div>
          </section>

          <section class="settings-section settings-tab-section" id="settings-sounds" data-settings-section="settings-sounds" hidden>
            <div class="settings-section-head">
              <div>
                <h3>Sounds</h3>
              </div>
            </div>
            <div class="selected-room-alert-sound-card" id="settings-room-alert-sound">
              <div class="selected-room-volume-header">
                <div class="selected-room-volume-title">Alert Sound</div>
              </div>
              <div class="selected-room-volume-controls" id="settings-room-alert-sound-controls"></div>
            </div>
            <div class="selected-room-volume-card message-sound-card">
              <div class="selected-room-volume-header">
                <div class="selected-room-volume-title">Message Sound</div>
              </div>
              <div class="selected-room-volume-controls">
                <label class="selected-room-sound-field">
                  <span class="selected-room-control-label">Select Sound</span>
                  <div class="selected-room-sound-row">
                    <select class="selected-room-sound-select" id="message-sound-input"></select>
                    <button
                      class="selected-room-sound-test"
                      id="message-sound-test-button"
                      type="button"
                      aria-label="Play message sound"
                      title="Play message sound"
                    >
                      Play
                    </button>
                  </div>
                </label>
                <label class="selected-room-slider-field">
                  <span class="selected-room-control-label">Volume</span>
                  <div class="selected-room-slider-row">
                    <input
                      class="selected-room-volume-slider"
                      id="message-volume-input"
                      type="range"
                      min="0"
                      max="100"
                      step="1"
                    />
                    <span class="selected-room-volume-value" id="message-volume-value">80%</span>
                  </div>
                </label>
              </div>
            </div>
          </section>

          <section class="settings-section settings-tab-section" id="settings-general" data-settings-section="settings-general">
            <div class="settings-section-head">
              <div>
                <h3>General</h3>
              </div>
            </div>
            <div class="room-select-card">
              <label class="field room-select-field">
                <span>Room</span>
                <select id="room-select"></select>
              </label>
              <p class="room-restart-note">Restart app after changing rooms</p>
            </div>
            <div class="checkbox-toggle-field">
              <label class="checkbox-toggle">
                <input id="launch-at-startup-input" type="checkbox" />
                <span>Run at startup</span>
              </label>
              <label class="checkbox-toggle">
                <input id="show-panel-at-startup-input" type="checkbox" />
                <span>Minimise at startup</span>
              </label>
              <label class="checkbox-toggle">
                <input id="always-on-top-input" type="checkbox" />
                <span>Always on top</span>
              </label>
            </div>
            <div class="field full-width-field">
              <span>Popup Position</span>
              <select id="popup-position-input">
                <option value="bottomRight">Bottom Right</option>
                <option value="topRight">Top Right</option>
              </select>
            </div>
          </section>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./panel.js"></script>
  </body>
</html>
