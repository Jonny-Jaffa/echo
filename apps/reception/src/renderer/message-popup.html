<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Message</title>
    <link rel="stylesheet" href="./fonts.css" />
    <link rel="stylesheet" href="./message-popup.css" />
  </head>
  <body>
    <article class="message-popup" id="message-popup">
      <div class="message-popup-source" id="message-popup-source">S1</div>
      <p class="message-popup-text" id="message-popup-text"></p>
      <div class="message-popup-actions" aria-hidden="false">
        <span class="message-popup-age" id="message-popup-age">Just now</span>
        <span class="message-popup-count" id="message-popup-count">1</span>
        <button class="message-popup-dismiss" id="message-popup-dismiss" type="button" aria-label="Confirm alert">Dismiss</button>
        <button class="message-popup-message-icon" id="message-popup-message-icon" type="button" aria-label="Open room messages">Messages</button>
        <button class="message-popup-close" id="message-popup-close" type="button" aria-label="Dismiss notification">Close</button>
      </div>
    </article>
    <script src="./message-popup.js"></script>
  </body>
</html>
